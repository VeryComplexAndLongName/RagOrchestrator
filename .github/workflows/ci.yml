name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[all,dev]"

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy --config-file pyproject.toml src tests scripts

      - name: Pytest
        run: uv run pytest -q
